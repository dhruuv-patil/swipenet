services:
  - type: web
    name: swipenet-api
    env: node
    plan: free
    rootDir: swipenet-server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
